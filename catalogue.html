<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Catalogue Officiel — Cvisual POS</title>

    <!-- Typographie : DM Sans (Corps) & Syne (Titres) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=Syne:wght@600;700;800&display=swap" rel="stylesheet">

    <!-- Styles CSS -->
    <link rel="stylesheet" href="assets/css/variables.css">
    <link rel="stylesheet" href="assets/css/main.css">
    <link rel="stylesheet" href="assets/css/catalogue.css">

    <!-- CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="catalogue-page-wrapper">

    <div class="catalogue-container" id="catalogue-root">
        <div style="padding: 80px 20px; text-align: center; color: var(--text-muted);">
            <i data-lucide="loader-2" style="animation: spin 1s linear infinite; width: 36px; height: 36px; color: var(--color-primary); margin: 0 auto 12px auto; display: block;"></i>
            <div style="font-weight: 600; font-size: 15px;">Chargement de la vitrine...</div>
        </div>
    </div>

    <!-- BARRE FLOTTANTE DU PANIER -->
    <div class="catalogue-floating-cart-bar" id="cat-floating-cart">
        <div class="cart-bar-info">
            <div class="cart-bar-badge" id="cat-cart-badge">0</div>
            <div>
                <div class="cart-bar-total-label">Panier en cours</div>
                <div class="cart-bar-total-amount" id="cat-cart-total">0.00 HTG</div>
            </div>
        </div>
        <button type="button" class="btn-cart-bar-checkout" id="btn-open-cart-sheet">
            <span>Valider ma commande</span>
            <i data-lucide="arrow-right" style="width: 16px; height: 16px;"></i>
        </button>
    </div>

    <!-- TIROIR MODAL DU PANIER & COMMANDE EN LIGNE (BOTTOM SHEET) -->
    <div class="cart-sheet-backdrop" id="cart-sheet-modal">
        <div class="cart-sheet-dialog">
            <div class="cart-sheet-header">
                <div class="cart-sheet-title">
                    <i data-lucide="shopping-bag" style="color: var(--color-primary);"></i>
                    <span>Votre Commande en Ligne</span>
                </div>
                <button type="button" class="cart-sheet-close" id="btn-close-cart-sheet">
                    <i data-lucide="x" style="width: 20px; height: 20px;"></i>
                </button>
            </div>

            <div class="cart-sheet-body" id="cart-checkout-body">
                <div id="cart-sheet-items-list"></div>

                <!-- FORMULAIRE DE COMMANDE & COMPTE CLIENT -->
                <div class="cart-sheet-form" id="checkout-form-container">
                    <div id="checkout-auth-banner"></div>

                    <div>
                        <label style="font-size: 12px; font-weight: 600; color: var(--color-navy); display: block; margin-bottom: 4px;">Votre nom et prénom *</label>
                        <input type="text" id="order-customer-name" class="form-control" placeholder="Ex: Stéphanie Paul" required style="height: 42px; font-size: 14px;">
                    </div>
                    <div>
                        <label style="font-size: 12px; font-weight: 600; color: var(--color-navy); display: block; margin-bottom: 4px;">Numéro Téléphone / WhatsApp *</label>
                        <input type="tel" id="order-customer-phone" class="form-control" placeholder="Ex: +509 3455 6677" required style="height: 42px; font-size: 14px;">
                    </div>
                    <div>
                        <label style="font-size: 12px; font-weight: 600; color: var(--color-navy); display: block; margin-bottom: 4px;">Adresse de livraison ou ville</label>
                        <input type="text" id="order-customer-address" class="form-control" placeholder="Ex: Laboule 12, Pétion-Ville" style="height: 42px; font-size: 14px;">
                    </div>

                    <!-- Création de mot de passe si non connecté -->
                    <div id="checkout-password-group">
                        <label style="font-size: 12px; font-weight: 600; color: var(--color-navy); display: block; margin-bottom: 4px;">
                            Mot de passe secret (pour suivre vos commandes) *
                        </label>
                        <input type="password" id="order-customer-password" class="form-control" placeholder="4 à 6 chiffres ou mot de passe" style="height: 42px; font-size: 14px;">
                        <span style="font-size: 11px; color: var(--text-muted); margin-top: 3px; display: block;">
                            Un profil client sera automatiquement créé pour vous permettre de suivre le statut en direct.
                        </span>
                    </div>

                    <div>
                        <label style="font-size: 12px; font-weight: 600; color: var(--color-navy); display: block; margin-bottom: 4px;">Remarques, date ou heure souhaitée</label>
                        <textarea id="order-customer-notes" class="form-control" rows="2" placeholder="Précisez un rendez-vous ou des détails particuliers..." style="min-height: 60px; font-size: 13px;"></textarea>
                    </div>
                </div>

                <!-- ÉCRAN DE CONFIRMATION DE COMMANDE -->
                <div id="order-confirmation-view" style="display: none; padding: 20px 0; text-align: center;"></div>
            </div>

            <div class="cart-sheet-footer" id="cart-sheet-footer">
                <div class="cart-sheet-total-row">
                    <span class="cart-sheet-total-label">Total à payer :</span>
                    <span class="cart-sheet-total-val" id="cart-sheet-total-val">0.00 HTG</span>
                </div>
                <button type="button" class="btn btn-primary" id="btn-submit-order" style="width: 100%; height: 48px; border-radius: 999px; font-size: 15px; font-weight: 700; gap: 8px;">
                    <i data-lucide="check-circle-2"></i>
                    <span>Enregistrer la commande</span>
                </button>
            </div>
        </div>
    </div>

    <!-- MODALE ESPACE CLIENT (CONNEXION & SUIVI COMMANDES) -->
    <div class="modal-overlay" id="customer-account-modal">
        <div class="modal-dialog" style="max-width: 520px;">
            <div class="modal-header">
                <div class="modal-title" style="display: flex; align-items: center; gap: 8px;">
                    <i data-lucide="user" style="color: var(--color-primary);"></i>
                    <span id="account-modal-title">Espace Client</span>
                </div>
                <button type="button" class="btn btn-outline btn-sm" id="btn-close-account-modal" style="padding: 4px 8px;">
                    <i data-lucide="x"></i>
                </button>
            </div>

            <div class="modal-body">
                <!-- VUE 1 : CLIENT CONNECTÉ (MES COMMANDES) -->
                <div id="view-customer-orders" style="display: none;">
                    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; padding-bottom: 12px; border-bottom: 1px solid var(--border-subtle);">
                        <div>
                            <div style="font-weight: 700; font-size: 15px; color: var(--color-navy);" id="logged-customer-name">Stéphanie Paul</div>
                            <div style="font-size: 12px; color: var(--text-muted);" id="logged-customer-phone">+509 3455 6677</div>
                        </div>
                        <button type="button" class="btn btn-outline btn-sm" id="btn-customer-logout" style="color: var(--color-danger); border-color: #FECACA;">
                            <i data-lucide="log-out" style="width: 14px; height: 14px;"></i>
                            <span>Déconnexion</span>
                        </button>
                    </div>

                    <div style="font-family: var(--font-heading); font-size: 15px; font-weight: 700; color: var(--color-navy); margin-bottom: 12px;">
                        Historique de mes commandes
                    </div>
                    <div id="customer-orders-list"></div>
                </div>

                <!-- VUE 2 : FORMULAIRE DE CONNEXION / INSCRIPTION -->
                <div id="view-customer-auth">
                    <div style="display: flex; gap: 8px; margin-bottom: 16px;">
                        <button type="button" class="btn btn-primary btn-sm" id="tab-auth-login" style="flex: 1;">Se connecter</button>
                        <button type="button" class="btn btn-outline btn-sm" id="tab-auth-register" style="flex: 1;">Créer un profil</button>
                    </div>

                    <!-- 2.1 FORMULAIRE CONNEXION -->
                    <form id="form-customer-login">
                        <div class="form-group" style="margin-bottom: 12px;">
                            <label class="form-label">Numéro Téléphone / WhatsApp</label>
                            <input type="tel" id="auth-login-phone" class="form-control" placeholder="+509 3455 6677" required>
                        </div>
                        <div class="form-group" style="margin-bottom: 16px;">
                            <label class="form-label">Mot de passe secret</label>
                            <input type="password" id="auth-login-pass" class="form-control" placeholder="••••••••" required>
                        </div>
                        <button type="submit" class="btn btn-primary" style="width: 100%; height: 44px; border-radius: 999px;">
                            <span>Accéder à mes commandes</span>
                        </button>
                    </form>

                    <!-- 2.2 FORMULAIRE INSCRIPTION -->
                    <form id="form-customer-register" style="display: none;">
                        <div class="form-group" style="margin-bottom: 12px;">
                            <label class="form-label">Nom et Prénom *</label>
                            <input type="text" id="auth-reg-name" class="form-control" placeholder="Votre nom" required>
                        </div>
                        <div class="form-group" style="margin-bottom: 12px;">
                            <label class="form-label">Téléphone / WhatsApp *</label>
                            <input type="tel" id="auth-reg-phone" class="form-control" placeholder="+509 3455 6677" required>
                        </div>
                        <div class="form-group" style="margin-bottom: 12px;">
                            <label class="form-label">Adresse de livraison</label>
                            <input type="text" id="auth-reg-address" class="form-control" placeholder="Votre quartier ou ville">
                        </div>
                        <div class="form-group" style="margin-bottom: 16px;">
                            <label class="form-label">Créer un mot de passe *</label>
                            <input type="password" id="auth-reg-pass" class="form-control" placeholder="4 à 6 chiffres minimum" required>
                        </div>
                        <button type="submit" class="btn btn-primary" style="width: 100%; height: 44px; border-radius: 999px;">
                            <span>Créer mon compte client</span>
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script type="module">
        import { db } from './assets/js/supabase.js';

        let cartItems = [];
        let currentBusiness = null;
        let currentCurrency = 'HTG';
        let loggedCustomer = JSON.parse(localStorage.getItem('CVISUAL_CUSTOMER_SESSION') || 'null');

        // Hachage sécurisé SHA-256 natif
        async function sha256(str) {
            const encoder = new TextEncoder();
            const data = encoder.encode(str);
            const hash = await crypto.subtle.digest('SHA-256', data);
            return Array.from(new Uint8Array(hash)).map(b => b.toString(16).padStart(2, '0')).join('');
        }

        function getIconForProduct(product) {
            const name = (product.name || '').toLowerCase();
            const desc = (product.description || '').toLowerCase();
            const text = name + ' ' + desc;

            if (text.includes('coiff') || text.includes('tiss') || text.includes('braid') || text.includes('cheveu') || text.includes('mèche')) {
                return 'scissors';
            }
            if (text.includes('ongl') || text.includes('manucure') || text.includes('vernis') || text.includes('acrylique') || text.includes('pedicure') || text.includes('pédicure')) {
                return 'sparkles';
            }
            if (text.includes('visage') || text.includes('massage') || text.includes('soin') || text.includes('spa') || text.includes('peeling')) {
                return 'heart';
            }
            if (text.includes('huile') || text.includes('shamp') || text.includes('crème') || text.includes('lotion') || text.includes('kit') || text.includes('produit')) {
                return 'package';
            }
            return 'shopping-bag';
        }

        async function initCatalogue() {
            const root = document.getElementById('catalogue-root');
            const urlParams = new URLSearchParams(window.location.search);
            const slug = urlParams.get('e') || 'clarens-beauty-studio';

            try {
                // 1. Récupérer l'entreprise approuvée
                const { data: biz, error: bizErr } = await db.from('cvisual_businesses')
                    .select('*')
                    .eq('slug', slug)
                    .eq('status', 'approved')
                    .maybeSingle();

                if (bizErr || !biz) {
                    root.innerHTML = `
                        <div class="c-card" style="padding: 48px; max-width: 500px; margin: 60px auto; border-radius: 20px;">
                            <div style="width: 48px; height: 48px; border-radius: 50%; background: #FEF2F2; color: #EF4444; display: flex; align-items: center; justify-content: center; margin-bottom: 16px;">
                                <i data-lucide="store"></i>
                            </div>
                            <h2 style="font-size: 20px; font-weight: 700; color: #1B2A4A; margin-bottom: 8px;">Établissement non disponible</h2>
                            <p style="color: #64748B; font-size: 14px; line-height: 1.5;">Cette vitrine en ligne n'est pas encore publiée ou est momentanément inaccessible.</p>
                        </div>
                    `;
                    lucide.createIcons();
                    return;
                }

                currentBusiness = biz;
                currentCurrency = biz.primary_currency || 'HTG';
                document.title = `${biz.name} — Vitrine & Catalogue Officiel`;

                // 2. Charger catégories et produits actifs
                const [catsRes, prodsRes] = await Promise.all([
                    db.from('cvisual_categories').select('*').eq('business_id', biz.id).eq('is_active', true).order('sort_order'),
                    db.from('cvisual_products').select('*').eq('business_id', biz.id).eq('is_archived', false).eq('is_visible_in_catalogue', true).order('created_at', { ascending: false })
                ]);

                const categories = catsRes.data || [];
                const products = prodsRes.data || [];

                const initials = (biz.name || 'CV').split(' ').map(w => w[0]).join('').slice(0, 2).toUpperCase();

                root.innerHTML = `
                    <!-- BARRE ESPACE CLIENT -->
                    <div class="catalogue-user-bar">
                        <button type="button" class="btn-customer-account ${loggedCustomer ? 'active' : ''}" id="btn-open-account">
                            <i data-lucide="user"></i>
                            <span id="nav-account-label">${loggedCustomer ? `${loggedCustomer.name.split(' ')[0]} • Mes Commandes` : 'Se connecter / Mes commandes'}</span>
                        </button>
                    </div>

                    <!-- HERO BANNER -->
                    <div class="catalogue-hero">
                        <div class="catalogue-cover" style="${biz.cover_url ? `background-image: url('${biz.cover_url}');` : ''}"></div>
                        <div class="catalogue-profile-bar">
                            <div class="catalogue-logo-wrap">
                                ${biz.logo_url ? `
                                    <img src="${biz.logo_url}" alt="${biz.name}" class="catalogue-logo-img">
                                ` : `
                                    <div class="catalogue-logo-fallback">${initials}</div>
                                `}
                            </div>
                            <div class="catalogue-info">
                                <div class="catalogue-header-badges">
                                    <span class="badge-verified">
                                        <i data-lucide="check-circle" style="width: 12px; height: 12px;"></i>
                                        <span>Boutique Officielle</span>
                                    </span>
                                    <span class="badge-open">
                                        <span class="status-dot"></span>
                                        <span>Ouvert</span>
                                    </span>
                                </div>
                                <h1 class="catalogue-title">${biz.name}</h1>
                                ${biz.slogan ? `<div class="catalogue-slogan">${biz.slogan}</div>` : ''}
                                
                                <div class="catalogue-meta-row">
                                    <span class="catalogue-meta-item">
                                        <i data-lucide="map-pin" style="width: 14px; height: 14px; color: var(--color-primary);"></i>
                                        <span>${biz.address ? `${biz.address}, ` : ''}${biz.city || 'Haïti'}</span>
                                    </span>
                                    ${biz.phone ? `
                                        <span class="catalogue-meta-item">
                                            <i data-lucide="phone" style="width: 14px; height: 14px; color: var(--text-light);"></i>
                                            <span>${biz.phone}</span>
                                        </span>
                                    ` : ''}
                                </div>

                                <div class="catalogue-actions-bar">
                                    ${biz.whatsapp ? `
                                        <a href="https://wa.me/${biz.whatsapp.replace(/[^0-9]/g, '')}" target="_blank" class="social-pill wa-btn">
                                            <i data-lucide="message-circle" style="width: 15px; height: 15px;"></i>
                                            <span>WhatsApp Direct</span>
                                        </a>
                                    ` : ''}
                                    ${biz.phone ? `
                                        <a href="tel:${biz.phone}" class="social-pill">
                                            <i data-lucide="phone-call" style="width: 14px; height: 14px;"></i>
                                            <span>Appeler</span>
                                        </a>
                                    ` : ''}
                                    ${biz.instagram ? `
                                        <a href="https://instagram.com/${biz.instagram.replace('@', '')}" target="_blank" class="social-pill">
                                            <i data-lucide="instagram" style="width: 14px; height: 14px;"></i>
                                            <span>Instagram</span>
                                        </a>
                                    ` : ''}
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- RECHERCHE ET CATÉGORIES -->
                    <div class="catalogue-filters-wrap">
                        <div class="catalogue-search-box">
                            <i data-lucide="search"></i>
                            <input type="text" id="cat-search-input" class="catalogue-search-input" placeholder="Rechercher une prestation ou un produit...">
                        </div>

                        <div class="category-pills-scroll" id="cat-pills-container">
                            <button type="button" class="cat-filter-pill active" data-cat-id="">
                                <i data-lucide="grid" style="width: 14px; height: 14px;"></i>
                                <span>Tous les articles (${products.length})</span>
                            </button>
                            ${categories.map(c => `
                                <button type="button" class="cat-filter-pill" data-cat-id="${c.id}">
                                    <span>${c.name}</span>
                                </button>
                            `).join('')}
                        </div>
                    </div>

                    <!-- GRILLE PRODUITS (2 COLONNES MOBIL, 3-4 DESKTOP) -->
                    <div class="catalogue-products-grid" id="cat-products-grid">
                        ${renderProductsGridHTML(products, currentCurrency)}
                    </div>

                    <footer style="margin-top: 50px; padding: 24px 0; border-top: 1px solid var(--border-subtle); display: flex; justify-content: space-between; align-items: center; flex-wrap: gap; gap: 12px; font-size: 12px; color: var(--text-light);">
                        <div>© ${new Date().getFullYear()} ${biz.name} • Commandes directes enregistrées en caisse.</div>
                        <div style="font-weight: 600; color: var(--color-navy);">Designed by Cvisual</div>
                    </footer>
                `;

                lucide.createIcons();
                setupCatalogLogic(products, currentCurrency, biz);

            } catch (err) {
                console.error('Erreur catalogue:', err);
                root.innerHTML = `<div style="padding: 40px; text-align: left;">Erreur de connexion à la vitrine.</div>`;
            }
        }

        function renderProductsGridHTML(products, curr) {
            if (products.length === 0) {
                return `
                    <div class="empty-state" style="grid-column: 1 / -1; margin: 40px auto; text-align: center;">
                        <div class="empty-state-icon" style="margin: 0 auto 12px auto;"><i data-lucide="package-search"></i></div>
                        <div class="empty-state-title">Aucun article disponible</div>
                        <div class="empty-state-desc">Aucun produit ne correspond à votre filtre de recherche.</div>
                    </div>
                `;
            }

            return products.map(p => {
                const iconName = getIconForProduct(p);
                const hasImg = Boolean(p.image_url);

                return `
                    <div class="catalogue-product-card" data-product-id="${p.id}">
                        <div class="catalogue-card-media">
                            ${hasImg ? `
                                <img src="${p.image_url}" alt="${p.name}" class="catalogue-card-img" loading="lazy">
                            ` : `
                                <div class="catalogue-card-placeholder">
                                    <div class="placeholder-icon-circle">
                                        <i data-lucide="${iconName}" style="width: 22px; height: 22px;"></i>
                                    </div>
                                    ${p.unit && p.unit !== 'pièce' ? `
                                        <span class="placeholder-badge">${p.unit}</span>
                                    ` : ''}
                                </div>
                            `}
                        </div>
                        <div class="catalogue-card-body">
                            <div class="catalogue-product-name">${p.name}</div>
                            ${p.description ? `<div class="catalogue-product-desc">${p.description}</div>` : ''}
                            <div class="catalogue-card-footer">
                                <div class="catalogue-price-box">
                                    <span class="catalogue-price">${Number(p.sale_price).toLocaleString()} ${curr}</span>
                                </div>
                                <button type="button" class="btn-add-cart-mini" title="Ajouter à la commande" data-product-id="${p.id}">
                                    <i data-lucide="plus" style="width: 16px; height: 16px;"></i>
                                </button>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function setupCatalogLogic(allProducts, curr, biz) {
            const searchInput = document.getElementById('cat-search-input');
            const grid = document.getElementById('cat-products-grid');
            const pills = document.querySelectorAll('.cat-filter-pill');
            const floatingCartBar = document.getElementById('cat-floating-cart');
            const cartBadge = document.getElementById('cat-cart-badge');
            const cartTotal = document.getElementById('cat-cart-total');
            const cartModal = document.getElementById('cart-sheet-modal');
            const btnOpenCart = document.getElementById('btn-open-cart-sheet');
            const btnCloseCart = document.getElementById('btn-close-cart-sheet');
            const cartItemsList = document.getElementById('cart-sheet-items-list');
            const cartSheetTotalVal = document.getElementById('cart-sheet-total-val');
            const btnSubmitOrder = document.getElementById('btn-submit-order');
            const checkoutFormContainer = document.getElementById('checkout-form-container');
            const orderConfirmationView = document.getElementById('order-confirmation-view');
            const cartSheetFooter = document.getElementById('cart-sheet-footer');

            // Éléments Espace Client
            const accountModal = document.getElementById('customer-account-modal');
            const btnOpenAccount = document.getElementById('btn-open-account');
            const btnCloseAccount = document.getElementById('btn-close-account-modal');
            const viewCustomerOrders = document.getElementById('view-customer-orders');
            const viewCustomerAuth = document.getElementById('view-customer-auth');
            const tabAuthLogin = document.getElementById('tab-auth-login');
            const tabAuthRegister = document.getElementById('tab-auth-register');
            const formLogin = document.getElementById('form-customer-login');
            const formRegister = document.getElementById('form-customer-register');
            const btnCustomerLogout = document.getElementById('btn-customer-logout');
            const customerOrdersList = document.getElementById('customer-orders-list');

            let activeCat = '';
            let searchTerm = '';

            function filter() {
                let filtered = allProducts;
                if (activeCat) filtered = filtered.filter(p => p.category_id === activeCat);
                if (searchTerm) {
                    const q = searchTerm.toLowerCase();
                    filtered = filtered.filter(p => 
                        p.name.toLowerCase().includes(q) || 
                        (p.description && p.description.toLowerCase().includes(q))
                    );
                }
                grid.innerHTML = renderProductsGridHTML(filtered, curr);
                lucide.createIcons({ root: grid });
            }

            if (searchInput) {
                searchInput.addEventListener('input', (e) => {
                    searchTerm = e.target.value.trim();
                    filter();
                });
            }

            pills.forEach(p => {
                p.addEventListener('click', () => {
                    pills.forEach(item => item.classList.remove('active'));
                    p.classList.add('active');
                    activeCat = p.getAttribute('data-cat-id');
                    filter();
                });
            });

            // GESTION DU PANIER
            function updateCartUI() {
                const totalCount = cartItems.reduce((acc, item) => acc + item.quantity, 0);
                const totalPrice = cartItems.reduce((acc, item) => acc + (item.product.sale_price * item.quantity), 0);

                if (totalCount > 0) {
                    floatingCartBar.classList.add('visible');
                    cartBadge.textContent = totalCount;
                    cartTotal.textContent = `${totalPrice.toLocaleString()} ${curr}`;
                    cartSheetTotalVal.textContent = `${totalPrice.toLocaleString()} ${curr}`;
                } else {
                    floatingCartBar.classList.remove('visible');
                    cartModal.classList.remove('open');
                }

                if (cartItems.length === 0) {
                    cartItemsList.innerHTML = `<div style="text-align: center; color: var(--text-muted); padding: 20px 0;">Votre panier est vide.</div>`;
                } else {
                    cartItemsList.innerHTML = cartItems.map(item => `
                        <div class="cart-sheet-item">
                            <div style="flex: 1; min-width: 0;">
                                <div class="cart-sheet-item-name">${item.product.name}</div>
                                <div class="cart-sheet-item-price">${Number(item.product.sale_price).toLocaleString()} ${curr} / unité</div>
                            </div>
                            <div class="cart-qty-controls">
                                <button type="button" class="btn-qty btn-decrease-qty" data-product-id="${item.product.id}">-</button>
                                <span style="font-weight: 700; font-size: 14px; min-width: 18px; text-align: center;">${item.quantity}</span>
                                <button type="button" class="btn-qty btn-increase-qty" data-product-id="${item.product.id}">+</button>
                            </div>
                        </div>
                    `).join('');
                }
            }

            // Sync formulaire de checkout selon le client connecté
            function refreshCheckoutAuthUI() {
                const banner = document.getElementById('checkout-auth-banner');
                const nameInput = document.getElementById('order-customer-name');
                const phoneInput = document.getElementById('order-customer-phone');
                const addrInput = document.getElementById('order-customer-address');
                const passGroup = document.getElementById('checkout-password-group');

                if (loggedCustomer) {
                    banner.innerHTML = `
                        <div style="background: #ECFDF5; border: 1px solid #A7F3D0; padding: 10px 14px; border-radius: var(--radius-md); font-size: 12.5px; color: #065F46; display: flex; align-items: center; justify-content: space-between;">
                            <span>Connecté en tant que <strong>${loggedCustomer.name}</strong></span>
                            <i data-lucide="check-circle" style="width: 16px; height: 16px;"></i>
                        </div>
                    `;
                    nameInput.value = loggedCustomer.name || '';
                    phoneInput.value = loggedCustomer.phone || '';
                    addrInput.value = loggedCustomer.address || '';
                    passGroup.style.display = 'none';
                } else {
                    banner.innerHTML = '';
                    passGroup.style.display = 'block';
                }
                lucide.createIcons();
            }

            // Clic sur '+' d'une carte produit
            grid.addEventListener('click', (e) => {
                const addBtn = e.target.closest('.btn-add-cart-mini');
                if (addBtn) {
                    const prodId = addBtn.getAttribute('data-product-id');
                    const product = allProducts.find(p => p.id === prodId);
                    if (product) {
                        const existing = cartItems.find(item => item.product.id === prodId);
                        if (existing) {
                            existing.quantity++;
                        } else {
                            cartItems.push({ product, quantity: 1 });
                        }
                        updateCartUI();
                        addBtn.style.transform = 'scale(1.2)';
                        setTimeout(() => addBtn.style.transform = '', 150);
                    }
                }
            });

            // Ouvrir / Fermer le tiroir du panier
            btnOpenCart.addEventListener('click', () => {
                // Réinitialiser la vue de commande
                checkoutFormContainer.style.display = 'flex';
                cartItemsList.style.display = 'block';
                orderConfirmationView.style.display = 'none';
                cartSheetFooter.style.display = 'block';

                refreshCheckoutAuthUI();
                cartModal.classList.add('open');
            });

            btnCloseCart.addEventListener('click', () => {
                cartModal.classList.remove('open');
            });

            cartModal.addEventListener('click', (e) => {
                if (e.target === cartModal) cartModal.classList.remove('open');
            });

            // Incrément / Décrément quantités
            cartItemsList.addEventListener('click', (e) => {
                const decBtn = e.target.closest('.btn-decrease-qty');
                const incBtn = e.target.closest('.btn-increase-qty');

                if (decBtn) {
                    const id = decBtn.getAttribute('data-product-id');
                    const idx = cartItems.findIndex(i => i.product.id === id);
                    if (idx > -1) {
                        if (cartItems[idx].quantity > 1) cartItems[idx].quantity--;
                        else cartItems.splice(idx, 1);
                        updateCartUI();
                    }
                }

                if (incBtn) {
                    const id = incBtn.getAttribute('data-product-id');
                    const item = cartItems.find(i => i.product.id === id);
                    if (item) {
                        item.quantity++;
                        updateCartUI();
                    }
                }
            });

            // SOUMISSION ET ENREGISTREMENT DIRECT DANS L'ENTREPRISE
            btnSubmitOrder.addEventListener('click', async () => {
                if (cartItems.length === 0) return;

                const name = document.getElementById('order-customer-name').value.trim();
                const phone = document.getElementById('order-customer-phone').value.trim();
                const address = document.getElementById('order-customer-address').value.trim();
                const notes = document.getElementById('order-customer-notes').value.trim();
                const password = document.getElementById('order-customer-password').value.trim();

                if (!name || !phone) {
                    alert('Veuillez renseigner votre nom et votre numéro de téléphone.');
                    return;
                }

                btnSubmitOrder.disabled = true;
                btnSubmitOrder.innerHTML = `<span>Enregistrement en cours...</span>`;

                try {
                    let customerId = loggedCustomer?.id;

                    // 1. Si pas connecté, créer ou lier le client
                    if (!customerId) {
                        const passHash = password ? await sha256(password) : null;

                        // Vérifier si le client existe déjà par téléphone
                        const { data: existingCust } = await db.from('cvisual_customers')
                            .select('*')
                            .eq('business_id', biz.id)
                            .eq('phone', phone)
                            .maybeSingle();

                        if (existingCust) {
                            customerId = existingCust.id;
                            if (passHash && !existingCust.password_hash) {
                                await db.from('cvisual_customers').update({ password_hash: passHash, address: address || existingCust.address }).eq('id', customerId);
                            }
                            loggedCustomer = existingCust;
                        } else {
                            // Insérer nouveau profil client
                            const { data: newCust, error: custErr } = await db.from('cvisual_customers').insert([{
                                business_id: biz.id,
                                name: name,
                                phone: phone,
                                address: address,
                                password_hash: passHash,
                                notes: 'Client inscrit via le catalogue en ligne'
                            }]).select().single();

                            if (!custErr && newCust) {
                                customerId = newCust.id;
                                loggedCustomer = newCust;
                            }
                        }

                        // Sauvegarder la session client
                        if (loggedCustomer) {
                            localStorage.setItem('CVISUAL_CUSTOMER_SESSION', JSON.stringify(loggedCustomer));
                            document.getElementById('nav-account-label').textContent = `${loggedCustomer.name.split(' ')[0]} • Mes Commandes`;
                            document.getElementById('btn-open-account').classList.add('active');
                        }
                    }

                    // 2. Générer le numéro de commande
                    const dateStr = new Date().toISOString().slice(0, 10).replace(/-/g, '');
                    const randomSuffix = Math.floor(1000 + Math.random() * 9000);
                    const orderNumber = `CMD-${dateStr}-${randomSuffix}`;
                    const totalPrice = cartItems.reduce((acc, item) => acc + (item.product.sale_price * item.quantity), 0);

                    // 3. Enregistrer la commande dans cvisual_online_orders
                    const { data: orderData, error: orderErr } = await db.from('cvisual_online_orders').insert([{
                        order_number: orderNumber,
                        business_id: biz.id,
                        customer_id: customerId || null,
                        customer_name: name,
                        customer_phone: phone,
                        delivery_address: address,
                        subtotal: totalPrice,
                        total_amount: totalPrice,
                        currency: curr,
                        status: 'pending',
                        notes: notes
                    }]).select().single();

                    if (orderErr) throw orderErr;

                    // 4. Enregistrer les lignes d'articles dans cvisual_online_order_items
                    const orderItemsPayload = cartItems.map(item => ({
                        order_id: orderData.id,
                        product_id: item.product.id,
                        product_name: item.product.name,
                        quantity: item.quantity,
                        unit_price: item.product.sale_price,
                        total_price: item.product.sale_price * item.quantity
                    }));

                    await db.from('cvisual_online_order_items').insert(orderItemsPayload);

                    // 5. Afficher la confirmation avec succès
                    const savedItems = [...cartItems];
                    cartItems = [];
                    updateCartUI();

                    checkoutFormContainer.style.display = 'none';
                    cartItemsList.style.display = 'none';
                    cartSheetFooter.style.display = 'none';
                    orderConfirmationView.style.display = 'block';

                    const cleanWaPhone = (biz.whatsapp || biz.phone || '').replace(/[^0-9]/g, '');
                    const waMessage = encodeURIComponent(`Bonjour ${biz.name}, je viens de valider ma commande #${orderNumber} d'un montant de ${totalPrice.toLocaleString()} ${curr} sur votre vitrine en ligne.`);

                    orderConfirmationView.innerHTML = `
                        <div style="width: 60px; height: 60px; border-radius: 50%; background: #ECFDF5; color: #10B981; display: flex; align-items: center; justify-content: center; margin: 0 auto 16px auto;">
                            <i data-lucide="check" style="width: 32px; height: 32px;"></i>
                        </div>
                        <h2 style="font-family: var(--font-heading); font-size: 18px; font-weight: 800; color: var(--color-navy); margin-bottom: 6px;">Commande transmise avec succès !</h2>
                        <div style="font-size: 13px; color: var(--text-muted); margin-bottom: 16px;">
                            Numéro de référence : <strong style="color: var(--color-primary); font-family: var(--font-mono);">${orderNumber}</strong>
                        </div>

                        <div style="background: #F8FAFC; border: 1px solid var(--border-color); border-radius: var(--radius-lg); padding: 14px; text-align: left; margin-bottom: 20px; font-size: 13px;">
                            <div style="display: flex; justify-content: space-between; margin-bottom: 6px;">
                                <span>Statut actuel :</span>
                                <span class="order-status-badge order-status-pending">🟡 En attente de confirmation</span>
                            </div>
                            <div style="display: flex; justify-content: space-between;">
                                <span>Total commande :</span>
                                <strong style="color: var(--color-primary);">${totalPrice.toLocaleString()} ${curr}</strong>
                            </div>
                        </div>

                        <div style="display: flex; flex-direction: column; gap: 10px;">
                            ${cleanWaPhone ? `
                                <a href="https://wa.me/${cleanWaPhone}?text=${waMessage}" target="_blank" class="btn btn-outline" style="border-color: #25D366; color: #16A34A; width: 100%; height: 44px; border-radius: 999px;">
                                    <i data-lucide="message-circle"></i>
                                    <span>Informer la boutique sur WhatsApp</span>
                                </a>
                            ` : ''}
                            <button type="button" class="btn btn-primary" id="btn-view-my-orders" style="width: 100%; height: 44px; border-radius: 999px;">
                                <i data-lucide="list"></i>
                                <span>Voir mes commandes en direct</span>
                            </button>
                        </div>
                    `;

                    lucide.createIcons({ root: orderConfirmationView });

                    document.getElementById('btn-view-my-orders').onclick = () => {
                        cartModal.classList.remove('open');
                        openCustomerAccountModal();
                    };

                } catch (err) {
                    console.error('Erreur commande:', err);
                    alert(`Une erreur est survenue lors de l'enregistrement : ${err.message || err}`);
                } finally {
                    btnSubmitOrder.disabled = false;
                    btnSubmitOrder.innerHTML = `<i data-lucide="check-circle-2"></i><span>Enregistrer la commande</span>`;
                    lucide.createIcons({ root: btnSubmitOrder });
                }
            });

            // =================================================================
            // ESPACE CLIENT : HISTORIQUE ET AUTHENTIFICATION
            // =================================================================
            async function loadCustomerOrders() {
                if (!loggedCustomer) return;
                customerOrdersList.innerHTML = `<div style="text-align: center; padding: 24px 0;"><i data-lucide="loader" style="animation: spin 1s linear infinite;"></i></div>`;
                lucide.createIcons({ root: customerOrdersList });

                try {
                    const { data: orders, error } = await db.from('cvisual_online_orders')
                        .select('*, cvisual_online_order_items(*)')
                        .eq('business_id', biz.id)
                        .or(`customer_phone.eq.${loggedCustomer.phone},customer_id.eq.${loggedCustomer.id}`)
                        .order('created_at', { ascending: false });

                    if (error || !orders || orders.length === 0) {
                        customerOrdersList.innerHTML = `
                            <div style="text-align: center; padding: 32px 16px; color: var(--text-muted); font-size: 13px;">
                                Vous n'avez pas encore passé de commande dans cet établissement.
                            </div>
                        `;
                        return;
                    }

                    const statusMap = {
                        'pending': { label: 'En attente 🟡', class: 'order-status-pending' },
                        'confirmed': { label: 'Confirmée 🔵', class: 'order-status-confirmed' },
                        'preparing': { label: 'En préparation 🟣', class: 'order-status-preparing' },
                        'ready': { label: 'Prête 🟢', class: 'order-status-ready' },
                        'delivered': { label: 'Livrée ✅', class: 'order-status-delivered' },
                        'cancelled': { label: 'Annulée 🔴', class: 'order-status-cancelled' }
                    };

                    customerOrdersList.innerHTML = orders.map(ord => {
                        const st = statusMap[ord.status] || { label: ord.status, class: 'order-status-pending' };
                        const itemsSummary = (ord.cvisual_online_order_items || [])
                            .map(i => `${i.quantity}x ${i.product_name}`)
                            .join(', ');

                        const dateFormatted = new Date(ord.created_at).toLocaleDateString('fr-FR', {
                            day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit'
                        });

                        return `
                            <div class="customer-order-card">
                                <div class="customer-order-header">
                                    <span class="customer-order-num">${ord.order_number}</span>
                                    <span class="customer-order-date">${dateFormatted}</span>
                                </div>
                                <div class="customer-order-items-preview">
                                    ${itemsSummary || 'Articles commandés'}
                                </div>
                                <div class="customer-order-footer">
                                    <span class="order-status-badge ${st.class}">${st.label}</span>
                                    <strong style="color: var(--color-primary); font-size: 14px;">${Number(ord.total_amount).toLocaleString()} ${ord.currency}</strong>
                                </div>
                            </div>
                        `;
                    }).join('');

                } catch (e) {
                    console.error('Erreur chargement commandes:', e);
                    customerOrdersList.innerHTML = `<div style="color: var(--color-danger); padding: 16px 0;">Impossible de charger les commandes.</div>`;
                }
            }

            function openCustomerAccountModal() {
                if (loggedCustomer) {
                    document.getElementById('logged-customer-name').textContent = loggedCustomer.name;
                    document.getElementById('logged-customer-phone').textContent = loggedCustomer.phone;
                    viewCustomerOrders.style.display = 'block';
                    viewCustomerAuth.style.display = 'none';
                    loadCustomerOrders();
                } else {
                    viewCustomerOrders.style.display = 'none';
                    viewCustomerAuth.style.display = 'block';
                }
                accountModal.classList.add('active');
                lucide.createIcons();
            }

            btnOpenAccount.onclick = openCustomerAccountModal;
            btnCloseAccount.onclick = () => accountModal.classList.remove('active');
            accountModal.onclick = (e) => {
                if (e.target === accountModal) accountModal.classList.remove('active');
            };

            // Bascule Onglets Login / Register dans la modale
            tabAuthLogin.onclick = () => {
                tabAuthLogin.className = 'btn btn-primary btn-sm';
                tabAuthRegister.className = 'btn btn-outline btn-sm';
                formLogin.style.display = 'block';
                formRegister.style.display = 'none';
            };

            tabAuthRegister.onclick = () => {
                tabAuthRegister.className = 'btn btn-primary btn-sm';
                tabAuthLogin.className = 'btn btn-outline btn-sm';
                formLogin.style.display = 'none';
                formRegister.style.display = 'block';
            };

            // Soumission Connexion Client
            formLogin.onsubmit = async (e) => {
                e.preventDefault();
                const phone = document.getElementById('auth-login-phone').value.trim();
                const pass = document.getElementById('auth-login-pass').value.trim();
                const passHash = await sha256(pass);

                const { data: cust, error } = await db.from('cvisual_customers')
                    .select('*')
                    .eq('business_id', biz.id)
                    .eq('phone', phone)
                    .eq('password_hash', passHash)
                    .maybeSingle();

                if (error || !cust) {
                    alert('Identifiants incorrects ou aucun compte trouvé avec ce numéro.');
                    return;
                }

                loggedCustomer = cust;
                localStorage.setItem('CVISUAL_CUSTOMER_SESSION', JSON.stringify(cust));
                document.getElementById('nav-account-label').textContent = `${cust.name.split(' ')[0]} • Mes Commandes`;
                document.getElementById('btn-open-account').classList.add('active');

                viewCustomerOrders.style.display = 'block';
                viewCustomerAuth.style.display = 'none';
                loadCustomerOrders();
            };

            // Soumission Inscription Client
            formRegister.onsubmit = async (e) => {
                e.preventDefault();
                const name = document.getElementById('auth-reg-name').value.trim();
                const phone = document.getElementById('auth-reg-phone').value.trim();
                const address = document.getElementById('auth-reg-address').value.trim();
                const pass = document.getElementById('auth-reg-pass').value.trim();
                const passHash = await sha256(pass);

                const { data: newCust, error } = await db.from('cvisual_customers').insert([{
                    business_id: biz.id,
                    name,
                    phone,
                    address,
                    password_hash: passHash
                }]).select().single();

                if (error) {
                    alert('Erreur lors de la création du compte : ' + error.message);
                    return;
                }

                loggedCustomer = newCust;
                localStorage.setItem('CVISUAL_CUSTOMER_SESSION', JSON.stringify(newCust));
                document.getElementById('nav-account-label').textContent = `${newCust.name.split(' ')[0]} • Mes Commandes`;
                document.getElementById('btn-open-account').classList.add('active');

                viewCustomerOrders.style.display = 'block';
                viewCustomerAuth.style.display = 'none';
                loadCustomerOrders();
            };

            // Déconnexion Client
            btnCustomerLogout.onclick = () => {
                loggedCustomer = null;
                localStorage.removeItem('CVISUAL_CUSTOMER_SESSION');
                document.getElementById('nav-account-label').textContent = 'Se connecter / Mes commandes';
                document.getElementById('btn-open-account').classList.remove('active');
                viewCustomerOrders.style.display = 'none';
                viewCustomerAuth.style.display = 'block';
            };
        }

        window.addEventListener('DOMContentLoaded', initCatalogue);
    </script>
</body>
</html>
